name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.5 --distribution-type bin

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Find APK
      id: find_apk
      run: |
        APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
        APK_NAME=$(basename "$APK_PATH")
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
        echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
        echo "Built APK: $APK_NAME"
        ls -lh "$APK_PATH"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: TemanQrisListener-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Build summary
      run: |
        echo "### APK Build Successful" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**APK Name:** ${{ steps.find_apk.outputs.apk_name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Cara download APK:**" >> $GITHUB_STEP_SUMMARY
        echo "1. Scroll ke bawah halaman ini sampai ketemu section Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "2. Klik TemanQrisListener-debug untuk download ZIP" >> $GITHUB_STEP_SUMMARY
        echo "3. Extract ZIP, dapat file APK" >> $GITHUB_STEP_SUMMARY
        echo "4. Transfer APK ke HP Android, install" >> $GITHUB_STEP_SUMMARY
